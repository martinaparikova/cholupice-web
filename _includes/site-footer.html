<footer class="site-footer">
  <div class="trail-stripe"></div>
  <div class="site-footer__inner">
    <p class="site-footer__name">{{ site.title }}</p>
    <p class="site-footer__meta">Spolek založen 10. 5. 2019 &middot; Cholupice, Praha 12</p>
    {% if site.email %}
    <p class="site-footer__contact">
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </p>
    {% endif %}
    <p class="site-footer__note">
      Obsah tohoto webu spravuje Sdružení pro rozvoj Cholupic.
    </p>
  </div>
</footer>
