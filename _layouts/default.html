<!DOCTYPE html>
<html lang="{{ site.lang | default: 'cs' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#obsah">Přeskočit na obsah</a>

  {% include site-header.html %}

  <main id="obsah" class="page">
    <div class="page__inner">
      {% unless page.url == '/' %}
        <p class="eyebrow">{{ page.title }}</p>
      {% endunless %}
      {{ content }}
    </div>
  </main>

  {% include site-footer.html %}
</body>
</html>
