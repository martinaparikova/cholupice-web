<!DOCTYPE html>
<html lang="{{ site.lang | default: 'cs' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 | escape }}">
  <meta name="theme-color" content="#173d2b">
  <link rel="icon" type="image/png" href="{{ '/assets/images/logo-cholupice.png' | relative_url }}">
  {% if page.redirect_to %}<meta http-equiv="refresh" content="0;url={{ page.redirect_to | relative_url }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Syne:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#obsah">Přeskočit na obsah</a>

  {% include site-header.html %}

  {% if page.title %}
  <section class="page-hero" aria-labelledby="page-heading">
    <div class="page-hero__inner">
      <h1 id="page-heading">{{ page.title }}</h1>
    </div>
  </section>
  {% endif %}

  <main id="obsah" class="page" tabindex="-1">
    <div class="page__inner{% if page.wide %} page__inner--wide{% endif %}">
      {{ content }}
    </div>
  </main>

  {% include site-footer.html %}
</body>
</html>
