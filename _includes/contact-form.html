<form class="contact-form" action="https://formsubmit.co/{{ site.email }}" method="POST" aria-describedby="contact-privacy">
  <input type="hidden" name="_subject" value="Zpráva z webu Sdružení pro rozvoj Cholupic">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" {% if site.url and site.url != "" %}name="_next" value="{{ '/dekujeme/' | absolute_url }}"{% endif %} data-next-path="{{ '/dekujeme/' | relative_url }}">
  <div class="contact-form__honey" aria-hidden="true">
    <label for="contact-honey">Nevyplňujte</label>
    <input id="contact-honey" type="text" name="_honey" tabindex="-1" autocomplete="off">
  </div>
  <label for="contact-name">Jméno</label>
  <input id="contact-name" type="text" name="jmeno" autocomplete="name" maxlength="150" required aria-describedby="contact-name-error">
  <span class="field-error" id="contact-name-error" hidden></span>
  <label for="contact-email">E-mail</label>
  <input id="contact-email" type="email" name="email" autocomplete="email" spellcheck="false" maxlength="254" required aria-describedby="contact-email-error">
  <span class="field-error" id="contact-email-error" hidden></span>
  <label for="contact-message">Zpráva</label>
  <textarea id="contact-message" name="zprava" rows="6" maxlength="10000" required aria-describedby="contact-message-error"></textarea>
  <span class="field-error" id="contact-message-error" hidden></span>
  <p id="contact-privacy" class="form-note">Jméno, e-mail a zprávu odešlete přes službu FormSubmit. <a href="#osobni-udaje">Jak formulář zpracovává údaje</a>. Neposílejte citlivé osobní údaje.</p>
  <p class="form-status" role="status" aria-live="polite"></p>
  <button class="home-about__link" type="submit">Odeslat zprávu <span aria-hidden="true">→</span></button>
</form>
